name: Render Minecraft Video V2

on:
  workflow_dispatch:
  push:
    paths:
      - "projects/short-001-zombie-fight/render-request-v2.txt"

concurrency:
  group: vellous-render-short-001-v2
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libgl1-mesa-dri xvfb mesa-utils
          blender --version
          ffmpeg -version | head -n 1

      - name: Prepare export directory
        run: mkdir -p projects/short-001-zombie-fight/exports

      - name: Generate V2 original soundtrack
        run: python3 scripts/generate_audio_v2.py

      - name: Render V2 preview
        shell: bash
        run: |
          set -euo pipefail
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b --python-exit-code 1 --python scripts/build_scene_v2.py
          test -s projects/short-001-zombie-fight/exports/short-001-v2-silent.mp4
          test -s projects/short-001-zombie-fight/exports/short-001-v2-scene.blend

      - name: Combine animation and audio
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y             -i projects/short-001-zombie-fight/exports/short-001-v2-silent.mp4             -i projects/short-001-zombie-fight/exports/v2-preview-audio.wav             -c:v copy             -c:a aac             -b:a 192k             -shortest             -movflags +faststart             projects/short-001-zombie-fight/exports/vellous-short-001-v2-preview.mp4

      - name: Verify MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s projects/short-001-zombie-fight/exports/vellous-short-001-v2-preview.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_name,codec_type,width,height,r_frame_rate -of default=noprint_wrappers=1 projects/short-001-zombie-fight/exports/vellous-short-001-v2-preview.mp4

      - name: Upload V2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: vellous-short-001-v2-preview
          path: |
            projects/short-001-zombie-fight/exports/vellous-short-001-v2-preview.mp4
            projects/short-001-zombie-fight/exports/v2-preview-audio.wav
            projects/short-001-zombie-fight/exports/short-001-v2-scene.blend
          if-no-files-found: error
          retention-days: 14
